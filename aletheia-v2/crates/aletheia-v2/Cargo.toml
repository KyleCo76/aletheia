[package]
name = "aletheia-v2"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Aletheia V2 — structured memory MCP server (Rust rewrite)"

[lib]
name = "aletheia_v2"
path = "src/lib.rs"

[[bin]]
name = "aletheia-v2"
path = "src/main.rs"

[dependencies]
rmcp = { workspace = true }
rusqlite = { workspace = true }
interprocess = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
hostname = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
nix = { workspace = true }

# Dev-only: re-import rmcp with the `client` feature ENABLED for the
# 2-tool spike integration test (Phase 4 S1 contract C-S2). Production
# builds do not link rmcp's client side. Pin matches the workspace pin
# exactly; cargo unifies features so only one rmcp crate is compiled,
# but with `client` ON when building tests.
[dev-dependencies]
rmcp = { version = "= 1.5.0", default-features = false, features = [
    "transport-io",
    "server",
    "client",
    "macros",
    "schemars",
] }
